<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kreis-Countdown mit Header-Bild</title>
  <style>
    :root {
        --text-color: #ffffff;
        --circle-bg: rgba(255, 255, 255, 0.1);
        --circle-color: #00ecff;
    }

    /* Setzt den Haupt-Hintergrund auf edles Schwarz */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* Verhindert horizontales Scrollen */
        background-color: #0d0d11; /* Dunkler, moderner Hintergrund */
    }

    body {
        color: var(--text-color);
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        position: relative;
    }

    /* 1. HERZEN-CONTAINER (Bleibt fixiert im Hintergrund) */
    .heart-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        pointer-events: none;
        z-index: 2;
    }

    /* 2. CONTENT-CONTAINER */
    .scroll-wrapper {
        position: relative;
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        box-sizing: border-box;
        z-index: 3;
        padding-bottom: 40px; /* Platzhalter ganz unten */
    }

    /* NEU: Bild-Container, der das Bild im richtigen Verhältnis hält */
    .image-container {
        width: 100%;
        max-width: 500px; 
        margin: 0 auto;
        position: relative; /* Wichtig für die absolute Positionierung des Titels */
        display: block; /* ÄNDERUNG: Verhindert, dass Elemente nebeneinander geschoben werden */
    }

    /* NEU: Das eigentliche Bild, das perfekt mitskaliert */
    .responsive-img {
      width: 100%;
      height: auto; 
      display: block;
      object-fit: contain;
      border-radius: 0 0 20px 20px; 
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    .wrapper {
        text-align: center;
        padding: 20px;
        width: 100%;
        max-width: 500px; 
        box-sizing: border-box;
    }

    .main-title {
      position: absolute;
      top: 25px; /* Abstand zum unteren Bildrand */
      left: 50%;
      transform: translateX(-50%); /* Zentriert den Titel exakt in der Mitte des Bildes */
      width: 85%; /* Verhindert das Anstoßen an den Rändern */
      margin: 0; 
      box-sizing: border-box;
      
      font-size: clamp(1.2rem, 5vw, 1.8rem); 
      font-weight: 700;
      display: flex;
      flex-direction: column; 
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 10; /* Setzt den Titel über das Bild */
      
      /* Lesbarkeits-Schutz über dem Foto */
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      background: none;
      padding: 0px;
      border-radius: 12px;
      backdrop-filter: none;
    }

    @media (min-width: 400px) {
      .main-title {
          flex-direction: row;
          width: auto;
          white-space: nowrap; /* Hält den Titel auf größeren Bildschirmen in einer Zeile */
      }
    }

    .emoji {
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif;
        font-size: 1.5rem;
    }

    .countdown-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr); 
        gap: 20px;
        justify-items: center;
        align-items: center;
        width: 100%;
        max-width: 360px;
        margin: 0 auto;
    }

    .time-box {
        position: relative;
        width: clamp(110px, 35vw, 150px);
        height: clamp(110px, 35vw, 150px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(255, 255, 255, 0.05); /* Leicht transparenter, edler Box-Hintergrund */
        backdrop-filter: blur(5px); /* Macht den Hintergrund unter der Box leicht weich */
        border-radius: 50%;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
    }

    circle {
        fill: none;
        stroke-width: 6;
    }

    .bg-circle {
        stroke: var(--circle-bg);
    }

    .progress-circle {
        stroke: var(--circle-color);
        stroke-linecap: round;
        stroke-dasharray: 440; 
        stroke-dashoffset: 0;
        transition: stroke-dashoffset 0.5s linear;
    }

    .number {
        font-size: clamp(1.4rem, 6vw, 2rem); 
        font-weight: bold;
        z-index: 10;
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
        line-height: 1;
    }

    .label {
        font-size: clamp(0.6rem, 2.5vw, 0.75rem);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 4px;
        color: #d1d1e0;
        z-index: 10;
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
    }
        
    /* Herzen-Partikel */
    .heart-particle {
        position: absolute;
        bottom: -30px;
        color: rgba(255, 75, 110, 0.7);
        font-family: Arial, sans-serif;
        user-select: none;
        pointer-events: none;
        animation: floatUp linear forwards;
    }

    @keyframes floatUp {
        0% {
            transform: translateY(0) translateX(0) rotate(0deg);
            opacity: 0;
        }
        10% {
            opacity: 1;
        }
        90% {
            opacity: 0.8;
        }
        100% {
            transform: translateY(-110vh) translateX(var(--drift)) rotate(var(--rotation));
            opacity: 0;
        }
    }
  </style>
</head>
<body>

  <!-- Herzen fliegen weiterhin im gesamten Hintergrund -->
  <div class="heart-container" id="heartContainer"></div>

  <!-- Die sichtbare Content-Ebene -->
  <div class="scroll-wrapper">
    
    <!-- NEU: Das Bild ganz oben im eigenen Container -->
    <div class="image-container">
      <img src="urlaub.jpg" alt="Urlaub" class="responsive-img">
      <h1 class="main-title">
          <span class="emoji">🥰😍🥳</span>WE Time<span class="emoji">🥳😍🥰</span>
      </h1>
    </div>
    <div class="wrapper">
      <div class="countdown-container">
        <div class="time-box">
          <svg viewBox="0 0 150 150">
              <circle class="bg-circle" cx="75" cy="75" r="70"></circle>
              <circle class="progress-circle" id="days-circle" cx="75" cy="75" r="70"></circle>
          </svg>
          <div class="number" id="days">00</div>
          <div class="label">Tage</div>
        </div>

        <div class="time-box">
          <svg viewBox="0 0 150 150">
              <circle class="bg-circle" cx="75" cy="75" r="70"></circle>
              <circle class="progress-circle" id="hours-circle" cx="75" cy="75" r="70"></circle>
          </svg>
          <div class="number" id="hours">00</div>
          <div class="label">Stunden</div>
        </div>

        <div class="time-box">
          <svg viewBox="0 0 150 150">
              <circle class="bg-circle" cx="75" cy="75" r="70"></circle>
              <circle class="progress-circle" id="minutes-circle" cx="75" cy="75" r="70"></circle>
          </svg>
          <div class="number" id="minutes">00</div>
          <div class="label">Minuten</div>
        </div>

        <div class="time-box">
          <svg viewBox="0 0 150 150">
              <circle class="bg-circle" cx="75" cy="75" r="70"></circle>
              <circle class="progress-circle" id="seconds-circle" cx="75" cy="75" r="70"></circle>
          </svg>
          <div class="number" id="seconds">00</div>
          <div class="label">Sekunden</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // COUNTDOWN LOGIK
    const targetDate = new Date("November 11, 2026 18:00:00").getTime();
    const maxValues = {days: 365, hours: 24, minutes: 60, seconds: 60};
    const totalCircumference = 440;

    function updateCircle(elementId, value, max) {
        const circle = document.getElementById(elementId);
        if(circle) {
            const offset = totalCircumference - (value / max) * totalCircumference;
            circle.style.strokeDashoffset = offset;
        }
    }

    function updateCountdown() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (difference < 0) {
            document.querySelectorAll('.number').forEach(num => num.innerText = "00");
            document.querySelectorAll('.progress-circle').forEach(circle => circle.style.strokeDashoffset = totalCircumference);
            clearInterval(intervalId);
            return;
        }

        const d = Math.floor(difference / (1000 * 60 * 60 * 24));
        const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = d < 10 ? "0" + d : d;
        document.getElementById("hours").innerText = h < 10 ? "0" + h : h;
        document.getElementById("minutes").innerText = m < 10 ? "0" + m : m;
        document.getElementById("seconds").innerText = s < 10 ? "0" + s : s;

        updateCircle("days-circle", d, maxValues.days);
        updateCircle("hours-circle", h, maxValues.hours);
        updateCircle("minutes-circle", m, maxValues.minutes);
        updateCircle("seconds-circle", s, maxValues.seconds);
    }

    updateCountdown();
    const intervalId = setInterval(updateCountdown, 1000);

    // HERZEN LOGIK
    const heartContainer = document.getElementById('heartContainer');

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart-particle');
        
      const heartTypes = ['❤️', '💖', '💝', '💕'];
      heart.innerText = heartTypes[Math.floor(Math.random() * heartTypes.length)];
      
      heart.style.left = Math.random() * 100 + 'vw';
      
      const size = Math.random() * 16 + 12;
      heart.style.fontSize = size + 'px';
      
      const duration = Math.random() * 4 + 4;
      heart.style.animationDuration = duration + 's';
      
      // Zufällige CSS-Variablen an die Animation übergeben (Drift zur Seite und Drehung)
      const drift = (Math.random() * 150 - 75) + 'px';
      const rotation = (Math.random() * 360 - 180) + 'deg';
      heart.style.setProperty('--drift', drift);
      heart.style.setProperty('--rotation', rotation);
      
      document.body.appendChild(heart);
      
      // Das Herz-Element automatisch löschen, wenn die Animation vorbei ist
      setTimeout(() => {
        heart.remove();
      }, duration * 1000);
    }

    // Alle 400 Millisekunden ein neues Herz auf die Reise schicken
    setInterval(createHeart, 400);                
  </script>
</body>
</html>
